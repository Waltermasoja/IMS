{% extends 'base.html' %}
{% load form_tags %}

{% block content %}
<div class="container-fluid">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title mb-4">Edit Product - {{ inventory.name }}</h3>

            {% include 'inventory/includes/form_errors.html' %}

            <form method="POST">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-control" required>
                            {% for category in categories %}
                            <option value="{{ category.id }}" {% if category.id == inventory.category.id %}selected{% endif %}>
                                {{ category.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Supplier</label>
                        <input type="text" name="bought_from" class="form-control" value="{{ inventory.bought_from }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" name="name" class="form-control" value="{{ inventory.name }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Label</label>
                        <input type="text" name="label" class="form-control" value="{{ inventory.label }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Size</label>
                        <input type="number" name="size" class="form-control" value="{{ inventory.size }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Quantity in Stock</label>
                        <input type="number" name="quantity_in_Stock" class="form-control" value="{{ inventory.quantity_in_Stock }}" required min="0">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Purchase Price</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" name="purchase_price" class="form-control" step="0.01" value="{{ inventory.purchase_price }}" required min="0">
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Selling Price</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" name="selling_price" class="form-control" step="0.01" value="{{ inventory.selling_price }}" required min="0">
                        </div>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ inventory.description }}</textarea>
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                            <input type="checkbox" name="on_sale" class="form-check-input" id="onSale" {% if inventory.on_sale %}checked{% endif %}>
                            <label class="form-check-label" for="onSale">Available for Sale</label>
                        </div>
                    </div>
                </div>

                <div class="form-group pt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-2"></i>Save Changes
                    </button>
                    <a href="{% url 'inventory' %}" class="btn btn-outline-secondary ms-2">
                        <i class="fas fa-times-circle me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
