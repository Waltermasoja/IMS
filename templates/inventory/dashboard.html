{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
<!-- Load Plotly.js -->
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
.chart-container {
    height: 400px;
    position: relative;
    margin: 20px 0;
    padding: 15px;
}

.no-data-message {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    color: #858796;
    font-size: 1rem;
    text-align: center;
}

.card {
    margin-bottom: 24px;
    border: none;
    box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
}

.card-header {
    background-color: #f8f9fc;
    border-bottom: 1px solid #e3e6f0;
}

.download-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1000;
}
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-xl-6 col-lg-6">
            <div class="card shadow">
                <div class="card-header">
                    <h6 class="m-0 font-weight-bold text-primary">Best Performing Products</h6>
                </div>
                <div class="card-body">
                    <div class="chart-container" id="best_performing_chart">
                        <!-- Chart will be rendered here -->
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-6 col-lg-6">
            <div class="card shadow">
                <div class="card-header">
                    <h6 class="m-0 font-weight-bold text-primary">Most Stocked Products</h6>
                </div>
                <div class="card-body">
                    <div class="chart-container" id="most_stocked_chart">
                        <!-- Chart will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    try {
        const bestPerformingData = JSON.parse('{{ best_performing_product|safe }}');
        const mostStockedData = JSON.parse('{{ most_stocked|safe }}');

        function createPlotlyChart(data, containerId, title, color) {
            if (!data || !data.length) {
                document.getElementById(containerId).innerHTML = `
                    <div class="no-data-message">
                        <i class="fas fa-chart-bar"></i>
                        <span>No data available</span>
                    </div>`;
                return;
            }

            const trace = {
                x: data.map(item => item.name),
                y: data.map(item => item.value),
                type: 'bar',
                marker: {
                    color: color
                }
            };

            const layout = {
                title: {
                    text: title,
                    font: {
                        size: 16,
                        color: '#4e73df'
                    }
                },
                height: 400,
                margin: {
                    l: 50,
                    r: 50,
                    t: 30,
                    b: 100
                },
                xaxis: {
                    tickangle: -45
                },
                yaxis: {
                    tickformat: title.includes('Sales') ? '$,.2f' : ',d'
                },
                bargap: 0.3,
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                showlegend: false
            };

            const config = {
                responsive: true,
                displayModeBar: true,
                displaylogo: false,
                modeBarButtonsToRemove: ['lasso2d', 'select2d'],
                toImageButtonOptions: {
                    format: 'png',
                    filename: containerId,
                    height: 500,
                    width: 700,
                    scale: 2
                }
            };

            Plotly.newPlot(containerId, [trace], layout, config);
        }

        // Create charts
        createPlotlyChart(
            bestPerformingData, 
            'best_performing_chart', 
            'Best Performing Products (Sales)', 
            '#4e73df'
        );
        
        createPlotlyChart(
            mostStockedData, 
            'most_stocked_chart', 
            'Most Stocked Products', 
            '#1cc88a'
        );

    } catch (error) {
        console.error('Error creating charts:', error);
        const charts = document.querySelectorAll('.chart-container');
        charts.forEach(container => {
            container.innerHTML = `
                <div class="no-data-message">
                    <i class="fas fa-chart-bar"></i>
                    <span>Error loading chart</span>
                </div>`;
        });
    }
});
</script>
{% endblock %}
