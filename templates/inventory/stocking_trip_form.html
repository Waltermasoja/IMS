{% extends 'base.html' %}
{% block title %}New Stocking Trip{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto space-y-4">
  <div class="bg-white rounded-2xl shadow-sm p-5">
    <h1 class="text-2xl font-bold text-gray-900"><i class="fas fa-plane text-blue-500 mr-2"></i>New Stocking Trip</h1>
  </div>

  <form method="post" class="bg-white rounded-2xl shadow-sm p-5 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Destination *</label>
      <input type="text" name="destination" required placeholder="e.g. China — Guangzhou"
             class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Start Date *</label>
        <input type="date" name="start_date" required
               class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">End Date</label>
        <input type="date" name="end_date"
               class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Notes</label>
      <textarea name="notes" rows="3"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
    </div>
    <div class="flex gap-2">
      <a href="{% url 'stocking_trips_list' %}" class="flex-1 py-2 text-center border border-gray-200 rounded-lg text-sm hover:bg-gray-50">Cancel</a>
      <button type="submit" class="flex-1 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">Create Trip</button>
    </div>
  </form>
</div>
{% endblock %}
