{% extends 'base.html' %}
{% block content %}
{% load static %}
<div class="content_section">
    <form method="POST" action="">
        {% csrf_token %}
        <fieldset>
            <legend class="border-bottom pd-2 mb-4 text-center">Add Product</legend>
            
            <div class="row">
                <!-- Left Column -->
                <div class="col-md-6">
                    <!-- Category Field -->
                    <div class="mb-3">
                        <label for="{{ form.category.id_for_label }}" class="form-label">Category</label>
                        <div class="input-group">
                            {{ form.category }}
                            <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Name Field -->
                    <div class="mb-3">
                        <label for="{{ form.name.id_for_label }}" class="form-label">Product Name</label>
                        <input type="text" name="name" class="form-control" id="{{ form.name.id_for_label }}" value="{{ form.name.value }}">
                    </div>

                    <!-- Size Field -->
                    <div class="mb-3">
                        <label for="{{ form.size.id_for_label }}" class="form-label">Size</label>
                        <input type="number" name="size" class="form-control" id="{{ form.size.id_for_label }}" value="{{ form.size.value }}">
                    </div>

                    <!-- Purchase Price Field -->
                    <div class="mb-3">
                        <label for="{{ form.purchase_price.id_for_label }}" class="form-label">Purchase Price</label>
                        <input type="number" step="0.01" name="purchase_price" class="form-control" id="{{ form.purchase_price.id_for_label }}" value="{{ form.purchase_price.value }}">
                    </div>

                    <!-- Quantity in Stock Field -->
                    <div class="mb-3">
                        <label for="{{ form.quantity_in_Stock.id_for_label }}" class="form-label">Quantity in Stock</label>
                        <input type="number" name="quantity_in_Stock" class="form-control" id="{{ form.quantity_in_Stock.id_for_label }}" value="{{ form.quantity_in_Stock.value }}">
                    </div>
                </div>

                <!-- Right Column -->
                <div class="col-md-6">
                    <!-- Supplier Field -->
                    <div class="mb-3">
                        <label for="{{ form.bought_from.id_for_label }}" class="form-label">Supplier</label>
                        <input type="text" name="bought_from" class="form-control" id="{{ form.bought_from.id_for_label }}" value="{{ form.bought_from.value }}">
                    </div>

                    <!-- Label Field -->
                    <div class="mb-3">
                        <label for="{{ form.label.id_for_label }}" class="form-label">Label</label>
                        <input type="text" name="label" class="form-control" id="{{ form.label.id_for_label }}" value="{{ form.label.value }}">
                    </div>

                    <!-- On Sale Field -->
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" name="on_sale" class="form-check-input" id="{{ form.on_sale.id_for_label }}" {% if form.on_sale.value %}checked{% endif %}>
                            <label class="form-check-label" for="{{ form.on_sale.id_for_label }}">Available for Sale</label>
                        </div>
                    </div>

                    <!-- Selling Price Field -->
                    <div class="mb-3">
                        <label for="{{ form.selling_price.id_for_label }}" class="form-label">Selling Price</label>
                        <input type="number" step="0.01" name="selling_price" class="form-control" id="{{ form.selling_price.id_for_label }}" value="{{ form.selling_price.value }}">
                    </div>
                </div>

                <!-- Full Width Description Field -->
                <div class="col-12">
                    <div class="mb-3">
                        <label for="{{ form.description.id_for_label }}" class="form-label">Description</label>
                        <textarea name="description" class="form-control" id="{{ form.description.id_for_label }}" rows="3">{{ form.description.value }}</textarea>
                    </div>
                </div>
            </div>
            
        </fieldset>
        <div class="form-group pt-4">
            <button type="submit" class="btn btn-outline-success">Add Product</button>
        </div>
    </form>
</div>

<!-- Add Category Modal -->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Add New Category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="addCategoryForm">
                {% csrf_token %}
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold mb-2">Category Name</label>
                        <input type="text" name="name" class="form-control rounded-3" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold mb-2">Description</label>
                        <textarea name="description" class="form-control rounded-3" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Category</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const addCategoryForm = document.getElementById('addCategoryForm');
    if (addCategoryForm) {
        addCategoryForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            fetch('{% url "add_category_ajax" %}', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    const categorySelect = document.getElementById('{{ form.category.id_for_label }}');
                    const option = new Option(data.category.name, data.category.id);
                    categorySelect.add(option);
                    categorySelect.value = data.category.id;
                    
                    // Reset the form
                    this.reset();
                    
                    // Close the modal
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addCategoryModal'));
                    modal.hide();
                    
                    // Show success message
                    const alertDiv = document.createElement('div');
                    alertDiv.className = 'alert alert-success alert-dismissible fade show';
                    alertDiv.innerHTML = `
                        <strong>Success!</strong> Category "${data.category.name}" added successfully.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    `;
                    document.querySelector('.content_section').insertAdjacentElement('afterbegin', alertDiv);
                    
                    // Remove alert after 3 seconds
                    setTimeout(() => {
                        alertDiv.remove();
                    }, 3000);
                } else {
                    console.error('Server Error:', data.error);
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Fetch Error:', error);
                console.error('Error Details:', error.message);
                alert('An error occurred while adding the category. Please check the console for details.');
            });
        });
    }
});
</script>

{% endblock %}
