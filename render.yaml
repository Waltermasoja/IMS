# Render Blueprint - IMS deployment config
# See: https://render.com/docs/blueprint-spec
#
# Python 3.12 via .python-version (avoids Pillow build failure on Python 3.14)
# Required env vars in Dashboard: SECRET_KEY, DATABASE_URL, DEBUG, ALLOWED_HOSTS

services:
  - type: web
    name: ims
    runtime: python
    # npm ci triggers postinstall -> build:tailwind:prod so output.css is
    # always rebuilt from the current tailwind.config.js on deploy. Without
    # this, utility classes added since the last committed output.css
    # would silently fail to render in production.
    buildCommand: pip install -r requirements.txt && npm ci
    startCommand: bash scripts/start.sh
